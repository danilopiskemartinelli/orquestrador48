services:
  orchestrator:
    build: .
    image: martinelli/orchestrator:latest
    container_name: orchestrator
    restart: unless-stopped
    ports:
      - "3310:80"
    depends_on:
      - stats-api

  stats-api:
    build: ./api
    image: martinelli/orchestrator-stats:latest
    container_name: orchestrator-stats
    restart: unless-stopped
    environment:
      SERVER_ID: MTLADVL048
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./mapa.yaml:/app/mapa.yaml:ro
